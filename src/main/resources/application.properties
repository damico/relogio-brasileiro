# Os arquivos estaticos (JS, CSS, imagens) sao revalidados a cada carga: o navegador pergunta ao
# servidor se mudaram e so baixa de novo se mudaram. Sem isso, depois de uma atualizacao ele pode
# insistir em usar o JavaScript antigo e a tela parece nao ter mudado.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
